<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Module Switch early bootstrap: theme/lang before first paint + one-shot entry splash
    try {
      var html = document.documentElement;
      var q = new URLSearchParams(window.location.search);
      var theme = q.get('theme');
      if (theme !== 'dark' && theme !== 'light') { try { theme = window.localStorage.getItem('site_theme'); } catch (e1) {} }
      if (theme !== 'dark' && theme !== 'light') theme = 'dark';
      var lang = q.get('lang');
      if (lang !== 'uk' && lang !== 'en') { try { lang = window.localStorage.getItem('site_lang'); } catch (e2) {} }
      if (lang !== 'uk' && lang !== 'en') lang = 'en';
      html.setAttribute('data-theme', theme);
      html.setAttribute('lang', lang);
      var reduced = false;
      try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e3) {}
      var marker = null;
      try { marker = JSON.parse(window.sessionStorage.getItem('yurii_nav') || 'null'); } catch (e4) {}
      function _yuriiCanon(s) { return s && s.length > 1 ? s.slice(1).split('&').sort().join('&') : ''; }
      if (marker && !reduced && marker.p === window.location.pathname
          && marker.q === _yuriiCanon(window.location.search) && (Date.now() - (marker.ts || 0)) < 8000) {
        try { window.sessionStorage.removeItem('yurii_nav'); } catch (e5) {}
        html.setAttribute('data-switch-in', '');
        window.__yuriiSplash = { since: Date.now() };
        // independent emergency un-cover: works even if transitions.js never loads/runs
        window.setTimeout(function () {
          document.documentElement.removeAttribute('data-switch-in');
          document.documentElement.removeAttribute('data-switch-lock');
        }, 1200);
      }
    } catch (bootErr) { /* transitions stay off: plain navigation keeps working */ }
  </script>
  <title>Media | Yurii Shmaliuk</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/transitions.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Anton&display=swap" rel="stylesheet">

  <!-- Module Switch transition overlay (shown by js/transitions.js) -->
  <div class="module-switch" id="module-switch">
    <div class="module-console window">
      <div class="window-header" aria-hidden="true">
        <span class="window-title">YURII.EXE / MODULE SWITCH</span>
        <div class="window-controls">
          <span class="control close"></span>
          <span class="control min"></span>
          <span class="control max"></span>
        </div>
      </div>
      <div class="window-content">
        <span class="module-command terminal-text" id="module-command" aria-hidden="true">&gt; open media.log</span>
        <div class="module-segments" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <span class="module-status terminal-text" role="status"><span id="module-status-text" data-uk-status="Переходимо до медіа…">Opening media…</span><span class="module-cursor" aria-hidden="true">█</span></span>
      </div>
    </div>
  </div>
  <script>(function(){if(document.documentElement.getAttribute('lang')==='uk'){var s=document.getElementById('module-status-text');if(s&&s.getAttribute('data-uk-status'))s.textContent=s.getAttribute('data-uk-status');}})();</script>
